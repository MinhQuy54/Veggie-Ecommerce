services:
  django:
    build:
      context: ./backend
    restart: on-failure
    env_file:
      - ./backend/veggie/.env
    environment:
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - ./backend/veggie/media:/app/veggie/media
    depends_on:
      - mysql_db
      - redis
    networks:
      - veggie_net
  rag_api:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: rag_api_service
    env_file:
      - ./chatbot/.env
    depends_on:
      - mysql_db
      - qdrant_db
    volumes:
      - ./chatbot/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
    - "8000:8000"
    restart: unless-stopped
    networks:
      - veggie_net
  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333" # ports REST API
      - "6334:6334" # ports gRPC 
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - veggie_net
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./backend/veggie/media:/app/veggie/media
    depends_on:
      - django
    networks:
      - veggie_net

  mysql_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: veggie_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"  
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - veggie_net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - veggie_net

networks:
  veggie_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  qdrant_storage:
