<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veggie - Demo Vegetable Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<style>
    :root {
        --veggie-green: #84b800;
    }

    body {
        background-color: #f8f9fa;
        font-family: 'Inter', sans-serif;
    }

    /* Group container */
    .checkout-section {
        background: white;
        padding: 30px;
        border: 1px solid #eee;
        margin-bottom: 20px;
    }

    /* Input styling */
    .form-label {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .input-group-text {
        background: white;
        border-left: none;
        color: var(--veggie-green);
    }

    .form-control,
    .form-select {
        border-right: none;
        padding: 12px;
        border-radius: 0;
        font-size: 14px;
    }

    /* Button Thêm địa chỉ */
    .btn-add-address {
        background-color: var(--veggie-green);
        color: white;
        border: none;
        padding: 10px 20px;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 13px;
    }

    .btn-add-address:hover {
        background-color: black;
    }

    /* Cột Tổng sản phẩm (Order Summary) */
    .order-summary {
        background: white;
        padding: 20px;
    }

    .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #f1f1f1;
        font-size: 14px;
    }

    .summary-row.total {
        border-bottom: none;
        font-weight: 800;
        font-size: 18px;
    }

    /* Payment Method */
    .payment-methods {
        margin-top: 30px;
    }

    .payment-option {
        border: 1px solid #eee;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
    }

    .payment-option input {
        margin-right: 15px;
    }

    .btn-save {
        background-color: #212529;
        color: white;
        border-radius: 0;
        padding: 10px 30px;
        text-transform: uppercase;
        font-weight: bold;
        font-size: 0.85rem;
        transition: 0.3s;
        border: none;
    }

    .btn-save:hover {
        background-color: var(--veggie-green);
        color: white;
    }
</style>

<body>
    <div id="header"></div>

    <main>
        <section class="about-header position-relative d-flex align-items-center justify-content-center text-white"
            style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/vegetarian-bg.jpeg') center/cover; height: 450px;">
            <div class="text-center">
                <h6 class="text-success fw-bold text-uppercase ls-2">Welcome to our store</h6>
                <h1 class="display-3 fw-bold">Checkout</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb justify-content-center mb-0">
                        <li class="breadcrumb-item"><a href="index.html"
                                class="text-white text-decoration-none">Home</a></li>
                        <li class="breadcrumb-item active text-success" aria-current="page">Checkout</li>
                    </ol>
                </nav>
            </div>
        </section>

        <section class="py-5" style="background-color: #fff;">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8">
                        <h4 class="fw-bold mb-4">Chi tiết thanh toán</h4>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="d-flex align-items-center flex-grow-1">
                                <span class="fw-bold me-2 text-nowrap" style="font-size: 14px;">Chọn địa chỉ
                                    khác:</span>
                                <select class="form-select w-50" id="address"
                                    style="border-radius: 4px; border: 1px solid #ddd;">
                                    <option id="address-option"></option>
                                </select>
                            </div>
                            <button class="btn-add-address ms-2" data-bs-toggle="modal"
                                data-bs-target="#addressModal">THÊM ĐỊA CHỈ MỚI</button>
                        </div>

                        <div class="checkout-section border p-4 mb-4">
                            <h6 class="fw-bold mb-4" style="color: #333;">Thông tin cá nhân</h6>
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <input type="text" class="form-control bg-light" value="" id="fullname">
                                        <span class="input-group-text bg-light border-start-0"><i
                                                class="fa-solid fa-user text-success"></i></span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <input type="text" class="form-control bg-light" value="" id="phone">
                                        <span class="input-group-text bg-light border-start-0"><i
                                                class="fa-solid fa-phone text-success"></i></span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Địa chỉ</label>
                                    <input type="text" class="form-control bg-light border-end"
                                        style="border-right: 1px solid #dee2e6 !important;" value=""
                                        id="address-detail">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Thành phố</label>
                                    <input type="text" class="form-control bg-light border-end"
                                        style="border-right: 1px solid #dee2e6 !important;" value="" id="city">
                                </div>
                            </div>
                        </div>

                        <div class="payment-methods">
                            <h5 class="fw-bold mb-4">Phương thức thanh toán</h5>
                            <div
                                class="payment-option border p-3 mb-2 d-flex align-items-center justify-content-between">
                                <div class="form-check m-0">
                                    <input class="form-check-input" type="radio" name="payment" id="cod">
                                    <label class="form-check-label fw-bold ms-2" for="cod">Thanh toán khi nhận
                                        hàng</label>
                                </div>
                                <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" width="40">
                            </div>
                            <div
                                class="payment-option border p-3 mb-2 d-flex align-items-center justify-content-between">
                                <div class="form-check m-0">
                                    <input class="form-check-input" type="radio" name="payment" id="momo" checked>
                                    <label class="form-check-label fw-bold ms-2" for="paypal">Momo</label>
                                </div>
                                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZcQPC-zWVyFOu9J2OGl0j2D220D49D0Z7BQ&s"
                                    height="25">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="order-summary p-4" style="background-color: #fff; margin-top: 50px;">
                            <h4 class="fw-bold mb-4">Tổng sản phẩm</h4>
                            <div id="summary-checkout"></div>
                            <template id="template-checkout">
                                <div class="summary-row d-flex justify-content-between py-2 border-bottom">
                                    <span class="text-muted name-checkout"></span>
                                    <span class="quantity-checkout"></span>
                                    <span class="fw-bold total-price-item-checkout"></span>
                                </div>
                            </template>
                            <div class="summary-row d-flex justify-content-between py-2 border-bottom">
                                <span class="text-muted">Vận chuyển và xử lý</span>
                                <span class="fw-bold">15.000đ</span>
                            </div>
                            <div class="summary-row d-flex justify-content-between py-2 border-bottom">
                                <span class="text-muted">Vat</span>
                                <span class="fw-bold">0</span>
                            </div>
                            <div class="summary-row d-flex justify-content-between py-3">
                                <span class="fw-bold h5">Tổng tiền</span>
                                <span class="fw-bold h5 total-checkout">

                                </span>
                            </div>
                        </div>
                        <button class="btn-add-address w-100 py-3 fw-bold text-uppercase" id="btn-place-order">
                            Đặt hàng ngay
                        </button>
                    </div>

                </div>
            </div>
        </section>
    </main>
    <div class="modal fade" id="addressModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold text-uppercase">Thông tin địa chỉ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="address-form">
                        <div class="mb-3">
                            <label class="form-label">Tên người nhận</label>
                            <input type="text" class="form-control" id="addr-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="addr-phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Thành phố</label>
                            <input type="text" class="form-control" id="addr-city" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ chi tiết</label>
                            <textarea class="form-control" id="addr-detail" rows="2" required></textarea>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="addr-default">
                            <label class="form-check-label" for="addr-default">Đặt làm mặc định</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" id="save-address-btn" class="btn btn-save px-4">Lưu lại</button>
                </div>
            </div>
        </div>
    </div>
    <div id="footer"></div>


</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/config.js"></script>
<script src="./js/cart.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/header.js"></script>
<script src="./js/checkout.js"></script>

</html>
